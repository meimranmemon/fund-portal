<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Fund Investor Portal</title>
<link rel="stylesheet" href="theme.css">
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0e1a;color:#e8e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{background:#151a2e;border:1px solid #262b47;border-radius:14px;padding:32px 28px;width:380px;max-width:94vw;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
h1{font-size:20px;margin:0 0 6px;text-align:center}
.sub{color:#94a3b8;font-size:13px;text-align:center;margin-bottom:24px}
button{width:100%;border:none;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.2s}
.btn-google{background:#ffffff;color:#1f2937}
.btn-google:hover{background:#f3f4f6}
.btn-google:disabled{opacity:0.6;cursor:wait}
.err{color:#fca5a5;background:#3f1414;font-size:12.5px;margin-top:14px;padding:10px;border-radius:8px;display:none;line-height:1.4}
.loading-state{display:none;text-align:center;color:#94a3b8;font-size:13px;margin-top:14px}
.icon{width:18px;height:18px}
</style>
<!-- Firebase Web SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="box">
  <h1>📊 Fund Investor Portal</h1>
  <div class="sub">Private investor dashboard — Sign in to access your funds.</div>

  <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
    <svg class="icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <span>Sign in with Google</span>
  </button>

  <div class="loading-state" id="loadingState">Signing you in, please wait...</div>
  <div class="err" id="errorBox"></div>
</div>

<script>
function nextUrl() {
  const n = new URLSearchParams(location.search).get('next');
  return n && n.startsWith('/') && !n.startsWith('//') ? n : '/';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('googleBtn').disabled = false;
}

// Check existing auth state on load
firebase.auth().onAuthStateChanged((user) => {
  if (user) {
    document.getElementById('loadingState').textContent = 'Opening your dashboard...';
    document.getElementById('loadingState').style.display = 'block';
    location.href = nextUrl();
  }
});

async function signInWithGoogle() {
  const btn = document.getElementById('googleBtn');
  const loading = document.getElementById('loadingState');
  const errBox = document.getElementById('errorBox');
  errBox.style.display = 'none';
  btn.disabled = true;
  loading.style.display = 'block';

  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInWithPopup(provider);
    location.href = nextUrl();
  } catch (err) {
    console.error("Sign-in error:", err);
    showError(err.message || 'Google Sign-in failed. Please try again.');
  }
}
</script>
</body>
</html>
